version: "3"

vars:
  IMAGE: ghcr.io/tobydoescode/tailscale-funnel-manager
  VERSION: 0.2.0
  PLATFORM: linux/arm64

tasks:
  test:
    desc: Run Go unit tests (containerized; no local Go required)
    cmds:
      - docker run --rm -v {{.TASKFILE_DIR}}:/src -w /src golang:1.26-alpine go test ./...

  tidy:
    desc: Run go mod tidy (containerized)
    cmds:
      - docker run --rm -v {{.TASKFILE_DIR}}:/src -w /src golang:1.26-alpine go mod tidy

  build:
    desc: Build funnel-manager ARM64 image
    cmds:
      - docker buildx build --platform {{.PLATFORM}} -t {{.IMAGE}}:{{.VERSION}} .

  push:
    desc: Build and push funnel-manager ARM64 image
    cmds:
      - docker buildx build --platform {{.PLATFORM}} -t {{.IMAGE}}:{{.VERSION}} --push .

  build-load:
    desc: Build and load funnel-manager ARM64 image locally
    cmds:
      - docker buildx build --platform {{.PLATFORM}} -t {{.IMAGE}}:{{.VERSION}} --load .
